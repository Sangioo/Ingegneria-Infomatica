<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercitazione form JavaScript</title>
    <script>
        function applica() {
            const select = document.getElementById("lista").value;
            document.getElementById("testo").value = select;
        }
        function modifica() {
            const testo = document.getElementById("testo").value;
            const lista = document.getElementById("lista");
            lista[lista.selectedIndex].innerText = testo;
        }
        function aggiungi() {
            const elem = document.createElement("option");
            elem.innerText = "tmp";
            document.getElementById("lista").appendChild(elem);
        }
        function rimuovi() {
            const lista = document.getElementById("lista");
            lista.removeChild(lista[lista.selectedIndex]);

            document.getElementById("testo").value = ""
        }
    </script>
</head>
<body>
    <select name="lista" id="lista" onclick="applica()">
        <option>Opzione 1</option>
        <option>Opzione 2</option>
        <option>Opzione 3</option>
    </select>
    <input type="text" name="testo" id="testo">
    <input type="button" value="modifica" id="modifica" onclick="modifica()">
    <input type="button" value="aggiungi" id="aggiungi" onclick="aggiungi()">
    <input type="button" value="rimuovi" id="rimuovi" onclick="rimuovi()">
</body>
</html>
