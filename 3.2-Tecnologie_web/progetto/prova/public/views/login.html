<!-- Pagina di login -->
<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/img/logo.svg" />
    <title>Login - FrameLog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-page">
    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="/img/logo.svg" alt="FrameLog" width="30" height="30" />
        </a>
        <a class="navbar-brand fw-bold" href="/">FrameLog</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/watchlist">Watchlist</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/watched">Watched</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile">Profile</a>
            </li>
          </ul>
          <div class="d-flex gap-2">
            <a class="btn btn-primary btn-sm" href="/login">Login</a>
            <a class="btn btn-outline-secondary btn-sm" href="/register">Register</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="auth-section">
      <section class="auth-card">
        <h1 class="auth-title mb-2">Accedi a FrameLog</h1>
        <p class="auth-subtitle mb-4">Inserisci le credenziali per continuare.</p>

        <form action="/login" method="post" class="d-grid gap-3">
          <div>
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="es. andrea"
              required
            />
          </div>

          <div>
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="********"
              required
            />
          </div>

          <button class="btn btn-primary mt-2" type="submit">Login</button>
        </form>

        <p class="auth-extra mb-0 mt-3">
          Non hai un account? <a href="/register">Registrati</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
