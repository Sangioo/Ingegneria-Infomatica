<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/bootstrap.css">
    <title>Sip 'n Snap</title>
</head>
<body>
    <!-- File in public vengono inviati al client -->
    <header class="container-fluid bg-primary d-flex justify-content-between align-items-center">
        <div>
            <a href="/" class="nav-link text-decoration-none fs-1">Sip 'n Snap</a>
        </div>

        <div>
            <a href="/ordina" class="text-decoration-none ms-4 fs-4">Ordina</a>
            <a href="/chi-siamo" class="text-decoration-none ms-4 fs-4">Chi Siamo</a>
            <a href="/contatti" class="text-decoration-none ms-4 fs-4">Contatti</a>
        </div>
                
    </header>

    <section class="container my-5">
        <div class="row">
            <img src="/images/sip-n-snap-1.png" alt="hero-image" class="object-fit-contain col col-md-6">
            <div class="col col-md-6 d-flex">
                <div class="mt-5 ms-md-5">
                    <h1>Sip 'n Snap</h1>
                    <h3>Ordina oggi il tuo frullato!</h3>
                    <a class="btn btn-secondary" href="/ordina" role="button">Esegui Ordine</a>
                </div>
               
            </div>
            
        </div>
        
    </section>

    <div class="container-fluid bg-secondary py-5">
        <section class="container">
            <div class="row">
                <div class="col col-md-6 d-flex">
                    <div class="mt-5 ms-md-5 mb-5 mb-md-0">
                        <h1>Dal 1985</h1>
                        <h3>Scopri la Nostra storia!</h3>
                        <a class="btn btn-secondary" href="/chi-siamo" role="button">Chi Siamo</a>
                    </div>
                
                </div>
                <img src="/images/sip-n-snap-2.png" alt="hero-image" class="object-fit-contain col col-md-6">
                
                
            </div>
            
        </section>
    </div>

    <section class="container my-5">
        <div class="mt-5 ms-md-5">
            <h1>Problemi con le ordinazioni?</h1>
            <h3>Contattaci</h3>
            <a class="btn btn-secondary" href="/contatti" role="button">Pagina contatti</a>
        </div>
        
    </section>


    <footer class="container-fluid bg-primary d-flex flex-column">
        <div>
            <a href="/" class="nav-link text-decoration-none fs-1">Sip 'n Snap</a>
        </div>

        <div class="d-flex flex-column">
            <a href="/ordina" class="text-decoration-none fs-4">Ordina</a>
            <a href="/chi-siamo" class="text-decoration-none fs-4">Chi Siamo</a>
            <a href="/contatti" class="text-decoration-none fs-4">Contatti</a>
        </div>
    </footer>
    
</body>
</html>
